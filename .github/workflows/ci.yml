name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: fmt
        working-directory: packages/contracts
        run: forge fmt --check
      - name: build
        working-directory: packages/contracts
        run: forge build
      - name: test
        working-directory: packages/contracts
        run: forge test

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:hosting
      - run: pnpm lint
      - run: pnpm format:check

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - name: demo stack (anvil + deploy + indexer + api + web)
        run: |
          pnpm demo &
          echo $! > demo.pid
          ready=0
          for i in $(seq 1 120); do
            if node --input-type=module -e 'const responses = await Promise.all([fetch("http://localhost:4000/health"), fetch("http://localhost:8056/")]); process.exit(responses.every(r => r.ok) ? 0 : 1)' 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            tail -n 80 data/demo-logs/*.log
            exit 1
          fi
      - name: killer-demo acceptance
        run: node scripts/demo-check.mjs
      - name: browser regression checks
        run: pnpm e2e
      - name: service diagnostics
        if: failure()
        run: tail -n 80 data/demo-logs/*.log
      - name: teardown
        if: always()
        run: kill "$(cat demo.pid)" 2>/dev/null || true
