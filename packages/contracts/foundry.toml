[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = false
ffi = false
fs_permissions = [
  { access = "read-write", path = "deployments" },
  { access = "read-write", path = "../../deployments" },
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 48
depth = 12

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 128
depth = 32

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
